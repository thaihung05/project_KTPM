{% extends 'layout/base.html' %}
{% block title %}Đăng nhập{% endblock %}

{% block content %}

<div style="margin-top: 120px;">
    <div class="d-flex justify-content-center mt-5 mb-5">
        <div class="card shadow-sm p-4" style="width: 420px">
            <h3 class="text-center text-primary fw-bold mb-4">Đăng nhập</h3>
             {% if err_msg %}
                <div class="alert alert-danger">{{ err_msg }}</div>
             {% endif %}
            <form method="post" action="{{ url_for('login_process', next=request.args.get('next')) }}">
                <div class="mb-3">
                    <label for="text" class="form-label">Tên đăng nhập:</label>
                    <input id="text" type="text" class="form-control" placeholder="Nhâp username" name="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu:</label>
                    <input id="password" type="password" class="form-control" placeholder="Nhâp mật khẩu" name="password">
                </div>

                <div class="d-flex justify-content-between align-item-center mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
                    </div>
                    <div>
                        <a href="/" class="text-decoration-none">Quên mật khẩu?</a>
                    </div>
                </div>
                <button class="btn btn-primary w-100 py-2">Đăng nhập</button>
            </form>

            <p class="text-center mt-3">
                Chưa có tài khoản?
                <a href="/register" class="text-decoration-none fw-bold">Đăng ký ngay!!!</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
